<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SparkUp | Contact Us</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .contact-section {
        padding: 50px 10%;
        text-align: center;
        background: #1e1e1e;
      }
      .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 10%;
      background: rgba(0, 0, 0, 0.8);
    }
      
      .contact-section h1 {
        font-size: 2.5rem;
        margin-bottom: 20px;
      }
      
      .contact-section p {
        font-size: 1rem;
        margin-bottom: 30px;
        color: #cccccc;
      }
      
      .contact-form .text-input {
        width: 100%;
        padding: 10px;
        border: 2px solid #444;
        border-radius: 5px;
        background: #252525;
        color: #fff;
        margin-bottom: 20px;
      }
      
      .contact-form button {
        background: #00bcd4;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.3s ease;
      }
      
      .contact-form button:hover {
        background: #008c9e;
      }
      
  </style>
</head>
<body>
  <div class="container">
    <header>
      <nav class="navbar">
        <div class="logo-container">
          <img src="logo.png" alt="SparkUp Logo" class="logo" height="150" width="150">
        </div>
        <ul class="nav-links">
            <li><a href="#features">Features</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="login.html" class="login-btn">Login</a></li>
          </ul>
      </nav>
    </header>

    <main>
      <section class="contact-section">
        <h1>Contact Us</h1>
        <p>Have questions or feedback? We’d love to hear from you!</p>

        <form id="contact-form">
          <div class="input-group">
            <label for="name">Name</label>
            <input type="text" id="name" class="text-input" placeholder="Your Name" required>
          </div>
          <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" class="text-input" placeholder="Your Email" required>
          </div>
          <div class="input-group">
            <label for="message">Message</label>
            <textarea id="message" class="text-input" rows="5" placeholder="Your Message" required></textarea>
          </div>
          <button type="submit" class="hero-btn">Send Message</button>
        </form>
      </section>
    </main>

    <footer class="footer">
      <p>&copy; 2025 SparkUp. All Rights Reserved.</p>
    </footer>
  </div>

  <script src="contact.js"></script>
</body>
</html>
