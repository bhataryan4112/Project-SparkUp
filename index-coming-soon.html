<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TheGroup11 | Project SparkUp</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;500&display=swap" rel="stylesheet">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9708845341671835"
     crossorigin="anonymous"></script>
  <style>
    /* General Reset */
    body {
            margin: 0;
            padding: 0;
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            color: white;
            background: linear-gradient(120deg, #000428, #004e92);
            background-size: 200% 200%;
            animation: gradientAnimation 8s ease infinite;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

    /* Background Gradient Animation */
    @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

    /* Main Container */
    .container {
      text-align: center;
      padding: 20px;
    }

    /* Logo Styling */
    .logo {
      font-size: 4rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: #00c6ff;
      text-shadow: 0px 0px 10px rgba(0, 198, 255, 0.8);
    }

    /* Subtitle Styling */
    .subtitle {
      font-size: 1.2rem;
      font-weight: 500;
      margin-top: 10px;
      color: #a8d8ea;
    }

    /* Teaser Text */
    .teaser {
      font-size: 1.8rem;
      font-weight: 400;
      margin-top: 50px;
      animation: fadein 2s infinite alternate;
      color: #ffffff;
    }

    @keyframes fadein {
      0% {
        opacity: 0.5;
      }
      100% {
        opacity: 1;
      }
    }

    .epic {
      font-size: 2.5rem;
      font-weight: 400;
      margin-top: 50px;
      animation: fadein 2s infinite alternate;
      color: #ffffff;
    }

    a {
  color: white;
}

a:hover {
  color: #5d61b4;
}
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Project SparkUp</div>
    <div class="subtitle">an initiative by, TheGroup11®</div>
    <div class="epic">Something EPIC, arrives soon...</div>
    <br>
    <br>
    <div class="subtitle">Follow us on Instagram: <a href="https://instagram.com/project_sparkup" target="_blank">@project_sparkup</a></div>
  </div>
</body>
</html>
